<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NativeLingo 本地英语跟读与看图学习工具">
  <meta name="theme-color" content="#f2f0ea">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>NativeLingo</title>
  <link rel="icon" href="%BASE_URL%Goza-LOGO-icon.png">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("nl-theme"); } catch (_) {}
      document.documentElement.classList.toggle("dark", saved === "dark");
    })();
  </script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#main-content" aria-label="NativeLingo 首页">
        <img src="%BASE_URL%Goza-LOGO-icon.png" alt="" width="34" height="34">
        <span>NativeLingo</span>
      </a>

      <nav class="modules" aria-label="学习模块">
        <button class="module module-active" type="button" data-module="speaking" aria-pressed="true">
          <span>跟读</span>
        </button>
        <button class="module" type="button" data-module="memorize" aria-pressed="false">
          <span>识物</span>
        </button>
      </nav>

      <div class="topbar-actions">
        <button id="backend-status" class="status status-pending" type="button" data-tooltip="正在启动本地服务" aria-controls="system-panel" aria-expanded="false">正在启动本地服务</button>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="切换主题"></button>
        <button id="info-toggle" class="icon-button" type="button" aria-label="应用信息" aria-controls="system-panel" aria-expanded="false"></button>
      </div>
    </header>

    <aside id="system-panel" class="system-panel" hidden>
      <div>
        <strong id="backend-detail">正在启动本地服务</strong>
        <span>识别、发音与照片均在本机处理</span>
      </div>
      <button id="system-panel-close" class="icon-button compact" type="button" aria-label="关闭应用信息"></button>
    </aside>

    <main id="main-content" class="app-main">
      <section id="module-speaking" class="module-pane" aria-label="英语跟读">
        <nav class="tabs mode-accordion" aria-label="素材类型">
          <button class="tab tab-active" type="button" data-mode="video" aria-pressed="true"><span>视频</span></button>
          <button class="tab" type="button" data-mode="audio" aria-pressed="false"><span>音频</span></button>
        </nav>

        <div id="mode-video" class="mode speaking-workbench">
          <aside class="source-rail">
            <div class="rail-heading">
              <h1>选择素材</h1>
              <button class="info-button" type="button" aria-label="素材说明" data-tooltip="首次打开素材时会在本机完成转写和切句">i</button>
            </div>
            <div id="video-list" class="video-list" aria-live="polite">
              <div class="skeleton-line"></div>
              <div class="skeleton-line short"></div>
            </div>
          </aside>

          <section class="practice-canvas" aria-label="跟读工作区">
            <div id="speaking-empty" class="canvas-empty">
              <span class="empty-glyph" aria-hidden="true"></span>
              <strong>从左侧选一段素材</strong>
              <span>字幕与录音控件会在这里出现</span>
            </div>

            <section id="sentence-section" class="transcript-panel" hidden>
              <div class="panel-heading">
                <h2>选取句子</h2>
                <span id="range-info" class="range-info" aria-live="polite">点按一句开始</span>
              </div>
              <div id="sentence-list" class="sentence-list"></div>
            </section>

            <section id="shadow-section" class="recording-stage" hidden>
              <div class="video-frame">
                <video id="shadow-video" class="shadow-video" muted playsinline></video>
              </div>
              <div class="record-dock">
                <button id="shadow-replay-btn" class="icon-button dock-secondary" type="button" aria-label="重放画面"></button>
                <button id="shadow-record-btn" class="record-control" type="button" aria-label="开始跟读"></button>
                <span id="shadow-timer" class="timer">00:00</span>
                <button id="shadow-analyze-btn" class="btn btn-primary" type="button" disabled>开始分析</button>
              </div>
              <audio id="shadow-learner-player" controls hidden></audio>
              <span id="shadow-analyze-status" class="analyze-status" role="status" aria-live="polite"></span>
            </section>
          </section>
        </div>

        <div id="mode-audio" class="mode speaking-workbench" hidden>
          <aside class="source-rail audio-source">
            <div class="rail-heading"><h1>参考音频</h1></div>
            <label class="file-picker" for="ref-file">
              <span class="file-picker-icon" aria-hidden="true"></span>
              <strong>选择音频</strong>
              <span>常见音频格式均可</span>
            </label>
            <input type="file" id="ref-file" accept="audio/*">
            <audio id="ref-player" controls hidden></audio>
          </aside>
          <section class="practice-canvas audio-canvas">
            <div class="audio-orbit" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
            <strong class="audio-target">听完参考音频后开始跟读</strong>
            <div class="record-dock audio-dock">
              <button id="record-btn" class="record-control" type="button" disabled aria-label="开始录音"></button>
              <span id="record-timer" class="timer">00:00</span>
              <button id="analyze-btn" class="btn btn-primary" type="button" disabled>开始分析</button>
            </div>
            <audio id="learner-player" controls hidden></audio>
            <span id="analyze-status" class="analyze-status" role="status" aria-live="polite"></span>
          </section>
        </div>

        <section id="results" class="results" hidden aria-label="发音结果">
          <div class="result-overview">
            <div class="overall-block">
              <span>本次表现</span>
              <strong id="overall-score" class="score-value">–</strong>
            </div>
            <div class="score-tracks">
              <div class="score-track" id="accuracy-track">
                <div><span>准确度</span><strong id="accuracy-score">–</strong></div>
                <span class="track"><i></i></span>
              </div>
              <div class="score-track" id="fluency-track">
                <div><span>流畅度</span><strong id="fluency-score">–</strong></div>
                <span class="track"><i></i></span>
              </div>
            </div>
          </div>
          <div id="reference-text" class="reference-text" hidden></div>
          <div id="rate-info" class="rate-info"></div>

          <div id="detail-block" class="result-detail" hidden>
            <div class="result-tools">
              <span>逐句反馈</span>
              <span class="result-key" aria-label="颜色越接近红色越需要练习"><i></i><i></i><i></i></span>
            </div>
            <div id="sentence-details" class="sentence-details"></div>
            <audio id="ref-clip-player" hidden></audio>
            <audio id="my-clip-player" hidden></audio>
          </div>

          <aside class="next-focus">
            <ul id="tips-list" class="tips"></ul>
            <div id="prosody-info" class="prosody"></div>
          </aside>
        </section>
      </section>

      <section id="module-memorize" class="module-pane" hidden aria-label="看图识物">
        <div id="memo-status" class="memo-status" role="status" aria-live="polite"></div>

        <section class="memo-entry card">
          <div class="memo-intro">
            <h1>把眼前事物<br>变成英语</h1>
            <p>拖入一张日常照片，点选物品开始探索。</p>
            <span class="local-note"><span aria-hidden="true" class="local-note-icon"></span>全程在本机处理</span>
          </div>
          <div id="memo-upload" class="memo-upload-zone">
            <input type="file" id="memo-file" accept="image/*">
            <label class="memo-upload-action" for="memo-file">
              <span class="upload-glyph" aria-hidden="true"></span>
              <strong>拖入一张照片</strong>
            </label>
            <button class="info-button" type="button" aria-label="支持的照片格式" data-tooltip="支持 JPG、PNG 与 HEIC，照片不会离开设备">i</button>
          </div>
        </section>

        <section id="memo-view" class="media-workspace card" hidden>
          <div class="memo-stage">
            <img id="memo-img" class="memo-img" alt="待识别的日常照片">
            <div id="memo-hotspots" class="memo-hotspots"></div>
            <div id="memo-analyzing" class="memo-overlay" hidden>
              <span class="scan-line" aria-hidden="true"></span>
              <strong>正在识别</strong>
            </div>
          </div>
          <div id="memo-object-summary" class="memo-object-summary" hidden></div>
          <div class="memo-actions">
            <button id="memo-reupload" class="btn btn-secondary" type="button">换张照片</button>
          </div>
        </section>

        <section id="memo-detail" class="object-inspector card" hidden>
          <div class="inspector-topbar">
            <button id="memo-back" class="icon-button" type="button" aria-label="返回整图"></button>
            <div id="memo-detail-label" class="memo-detail-label"></div>
            <div id="memo-parts-status" class="analyze-status" role="status" aria-live="polite"></div>
          </div>

          <div class="memo-detail-head">
            <div id="memo-detail-stage" class="memo-detail-stage">
              <img id="memo-detail-img" class="memo-detail-img" alt="选中物品的局部照片">
              <div id="memo-part-hotspots" class="memo-part-hotspots"></div>
              <div id="memo-parts-analyzing" class="memo-detail-overlay">
                <span class="scan-line" aria-hidden="true"></span>
                <strong>正在分析细节</strong>
              </div>
            </div>
          </div>

          <nav class="inspector-tabs" aria-label="物品学习方式">
            <button type="button" class="inspector-tab active" data-inspector-view="explore" aria-pressed="true">探索</button>
            <button type="button" class="inspector-tab" data-inspector-view="practice" aria-pressed="false">跟读</button>
            <button type="button" class="inspector-tab" data-inspector-view="context" aria-pressed="false">情景</button>
          </nav>

          <div class="inspector-panels">
            <section class="inspector-panel" data-inspector-panel="explore">
              <div id="memo-contents-section" hidden>
                <h2 class="sr-only">内容物</h2>
                <div id="memo-contents" class="memo-chips"></div>
              </div>
              <h2 class="sr-only">部件</h2>
              <div id="memo-parts" class="memo-chips"></div>
            </section>

            <section class="inspector-panel practice-panel" data-inspector-panel="practice" hidden>
              <p id="memo-pronounce-hint" class="practice-target">选择一个词开始跟读</p>
              <div id="memo-pronounce" class="memo-pronounce">
                <button id="memo-pronounce-record" class="record-control" type="button" disabled aria-label="开始录音"></button>
                <span id="memo-pronounce-timer" class="timer">00:00</span>
                <audio id="memo-pronounce-player" hidden></audio>
              </div>
              <div id="memo-pronounce-score" class="memo-pronounce-score" hidden></div>
            </section>

            <section class="inspector-panel context-panel" data-inspector-panel="context" hidden>
              <div id="memo-scenario-status" class="analyze-status" role="status" aria-live="polite"></div>
              <div id="memo-scenario" class="memo-scenario"></div>
            </section>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
